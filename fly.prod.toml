app = "sarjy-prod"
primary_region = "ams"   # match the Supabase project region

[build]

[env]
  APP_ENV = "prod"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2      # zero-downtime rolling deploys; no cold starts (PRD L-8)
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[deploy]
  strategy = "rolling"

# NOTE on multi-machine prod and speculative turns (PRD L-3, Phase 7 ledger):
# `SpeculativeTurnCache` (src/sarjy/contexts/conversation/application/speculation.py)
# — including its early-confirm half, which is what closes the race where
# `/chat/confirm` beats its own `/chat` turn to the park — is in-process, per
# worker, by design (a shared store would put a network round trip in the path
# of the write speculation exists to avoid). With min_machines_running = 2 and
# no `fly-replay` / sticky routing configured, a speculative turn's `/chat` and
# its confirming `/chat/confirm` can land on different machines under Fly's
# load-balanced routing, in which case the confirm finds nothing to match and
# the client falls back exactly as it does on any other 409: it sends the turn
# normally. Nothing is lost or duplicated either way — the speculative latency
# win is just not guaranteed across machines. Accepted as-is; revisit (Redis-
# backed registry, or Fly sticky sessions) only if that latency win needs to
# hold under multi-machine prod specifically.
